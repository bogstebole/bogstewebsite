name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            APP_DIR="$HOME/website"
            BACKUP_DIR="$HOME/website-backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            # Backup current .next build before deploying
            if [ -d "$APP_DIR/.next" ]; then
              mkdir -p "$BACKUP_DIR"
              cp -r "$APP_DIR/.next" "$BACKUP_DIR/.next_$TIMESTAMP"
              echo "Backup saved: $BACKUP_DIR/.next_$TIMESTAMP"

              # Keep only last 5 backups
              ls -dt "$BACKUP_DIR"/.next_* | tail -n +6 | xargs rm -rf
            fi

            cd "$APP_DIR"
            git pull origin main
            npm ci --production=false
            npm run build

            # Restart or start app with pm2
            if pm2 list | grep -q "website"; then
              pm2 restart website
            else
              pm2 start npm --name "website" -- start
              pm2 save
            fi

            echo "Deploy complete at $TIMESTAMP"
